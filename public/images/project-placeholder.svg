  <circle cx="72" cy="63" r="4.5" fill="#ff5500" />
  <circle cx="88" cy="63" r="4.5" fill="#faf8f5" fill-opacity="0.22" />
  <circle cx="104" cy="63" r="4.5" fill="#faf8f5" fill-opacity="0.22" />
  <rect x="330" y="57" width="140" height="12" rx="6" fill="#faf8f5" fill-opacity="0.08" />

