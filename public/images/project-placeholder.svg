  <!-- Right Preview Module -->
  <rect x="456" y="122" width="256" height="214" rx="4" fill="#151413" stroke="#ff5500" stroke-opacity="0.35" stroke-width="1" />
  <line x1="456" y1="162" x2="712" y2="162" stroke="#faf8f5" stroke-opacity="0.1" stroke-width="1" />
  <rect x="476" y="138" width="84" height="8" rx="2" fill="#faf8f5" fill-opacity="0.35" />
