<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <radialGradient id="studioGlow" cx="82%" cy="18%" r="75%">
      <stop offset="0%" stop-color="#ff5500" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#ff5500" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="surfaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171514" />
      <stop offset="100%" stop-color="#0c0c0d" />
    </linearGradient>
    <pattern id="archGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#faf8f5" stroke-opacity="0.045" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Base Surface -->
  <rect width="800" height="500" fill="url(#surfaceGrad)" />
  <rect width="800" height="500" fill="url(#studioGlow)" />
  <rect width="800" height="500" fill="url(#archGrid)" />

  <!-- Architectural Inner Window Frame -->
  <rect x="48" y="44" width="704" height="412" rx="8" fill="#101011" stroke="#faf8f5" stroke-opacity="0.14" stroke-width="1" />

