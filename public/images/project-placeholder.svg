  <rect x="88" y="190" width="260" height="28" rx="3" fill="#faf8f5" fill-opacity="0.45" />
  <rect x="88" y="238" width="290" height="10" rx="2" fill="#faf8f5" fill-opacity="0.25" />
  <rect x="88" y="258" width="240" height="10" rx="2" fill="#faf8f5" fill-opacity="0.25" />

